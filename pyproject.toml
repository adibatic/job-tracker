[project]
name = "job-tracker"
version = "0.1.0"
description = "Track, snapshot and classify job postings across N career sites"
authors = [{ name = "Adriel Imaran Santoso" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8.0"]

[project.scripts]
job-tracker = "job_tracker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
